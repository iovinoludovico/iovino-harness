# Production-like deployment: web app + webhook dispatcher.
# Supabase (hosted project) is external; configure it via .env.
services:
  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_ALLOWED_EMAIL_DOMAINS: ${NEXT_PUBLIC_ALLOWED_EMAIL_DOMAINS:-{{ALLOWED_DOMAINS}}}
    env_file: .env
    ports:
      - "3000:3000"
    restart: unless-stopped

  dispatcher:
    build:
      context: .
      target: dispatcher
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_BASE_URL: ${APP_BASE_URL}
      DISPATCHER_POLL_INTERVAL_MS: ${DISPATCHER_POLL_INTERVAL_MS:-30000}
    restart: unless-stopped
