# Behaviour of the application; the structure of the domain is in domain.ecore.yaml.
app:
  name: Anagrafica
  slug: anagrafica
  description: Persone, account e gruppi
  locales: [it, en]
  auth:
    providers: [google]
    allowed_domains: [gssi.it]
    admins: [ludovico.iovino@gssi.it]
roles:
  segreteria: { label: Segreteria }
entities:
  Persona:
    icon: user
    permissions:
      create: [segreteria]
      update: [segreteria]
  Gruppo:
    permissions:
      create: [segreteria]
