# Domain metamodel (Ecore notation). Edit it from the prompt (/appforge:metamodel),
# in the modeler (admin area or /appforge:studio) or by hand; behaviour lives in app.yaml.
package: invitations
nsURI: http://gssi.it/invitations
doc: Inviti di ospiti esterni del GSSI

classes:
  Department:
    label: {it: Dipartimento, en: Department}
    plural: {it: Dipartimenti, en: Departments}
    attributes:
      code: {type: EString, lower: 1, unique: true, label: {it: Codice, en: Code}}
      name: {type: EString, lower: 1, label: {it: Nome, en: Name}}
  Position:
    label: {it: Posizione, en: Position}
    plural: {it: Posizioni, en: Positions}
    attributes:
      name: {type: EString, lower: 1, unique: true, label: {it: Nome, en: Name}}
  Guest:
    label: {it: Invitato, en: Guest}
    plural: {it: Invitati, en: Guests}
    attributes:
      firstName: {type: EString, lower: 1, label: {it: Nome, en: First name}}
      lastName: {type: EString, lower: 1, label: {it: Cognome, en: Last name}}
      email: {type: Email, lower: 1, unique: true, label: Email}
      homeInstitution:
        type: EString
        label: {it: Istituzione di provenienza, en: Home institution}
    references:
      position: {type: Position, label: {it: Posizione, en: Position}}
  Fund:
    label: {it: Fondo, en: Fund}
    plural: {it: Fondi, en: Funds}
    attributes:
      name: {type: EString, lower: 1, label: {it: Nome, en: Name}}
      cup: {type: EString, label: CUP}
  Invitation:
    label: {it: Invito, en: Invitation}
    plural: {it: Inviti, en: Invitations}
    attributes:
      startDate: {type: Date, lower: 1, label: {it: Inizio visita, en: Visit start}}
      endDate: {type: Date, lower: 1, label: {it: Fine visita, en: Visit end}, list: false}
      compensationType: {type: CompensationType, default: none, label: {it: Tipo di compenso, en: Fee type}, list: false}
      hours: {type: EDouble, label: {it: Ore, en: Hours}, min: 0, list: false}
      hourlyRate: {type: Money, label: {it: Tariffa oraria, en: Hourly rate}, min: 0}
      accommodation: {type: BookingMethod, default: none, label: {it: Alloggio, en: Accommodation}}
      travel: {type: BookingMethod, default: none, label: {it: Viaggio, en: Travel}}
      notes: {type: Text, label: {it: Note, en: Notes}}
      visitConfirmedAt: {type: EDate, changeable: false, label: {it: Visita confermata il, en: Visit confirmed on}}
    references:
      guest: {type: Guest, lower: 1, label: {it: Invitato, en: Guest}, list: true}
      department: {type: Department, lower: 1, label: {it: Dipartimento, en: Department}, list: true}
      issuer: {type: User, label: {it: Emittente, en: Issuer}, list: true}
      funds: {type: Fund, upper: -1, label: {it: Fondi, en: Funds}}

enums:
  CompensationType:
    literals:
    - {name: hourly, label: {it: Orario, en: Hourly}}
    - {name: flat, label: {it: Forfettario, en: Flat fee}}
    - {name: none, label: {it: Nessun compenso, en: No fee}}
  BookingMethod:
    literals:
    - {name: agency, label: {it: Tramite agenzia, en: Through the agency}}
    - {name: receipts, label: {it: A piè di lista, en: Against receipts}}
    - {name: none, label: {it: Nessuno, en: None}}
